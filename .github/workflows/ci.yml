name: ci
on: [push, pull_request]
jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r requirements.txt
      - name: lint
        run: python -m ruff check src tests
      - name: unit tests
        run: python -m pytest -q tests --ignore=tests/test_smoke_pipeline.py
      - name: smoke test (pipeline completo sobre datos sintéticos)
        run: python -m pytest -q tests/test_smoke_pipeline.py
