# API del motor (python -m src.pipeline all antes de desplegar: la imagen copia data/serve.db, models y reports).
# Desplegar desde pipeline/:  fly deploy
app = "finhackers-api"
primary_region = "mad"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
